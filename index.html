<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ɮشمج</title>
<style>
  :root{
    --c1:#f7e8d6;
    --c2:#f4dec2;
    --c3:#cead8d;
    --c4:#bf8158;
    --c5:#7c563a;
    --c6:#6a4832;
    --c7:#9e846c;
    --c8:#85664f;
    --c9:#8a7d68;
    --c10:#362920;
    --c11:#2F0000;
    --c12:#C79C83;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    width:100%;
    overflow:hidden;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--c1);
    position:relative;
  }

  /* ---------- background gif ---------- */
  #bg-gif{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    z-index:-1;
  }

  /* ---------- pixel stars ---------- */
  #stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
  }
  .pixel-star{
    position:absolute;
    width:3px;
    height:3px;
    background:var(--c2);
    image-rendering:pixelated;
    box-shadow:0 0 4px 1px rgba(247,232,214,0.5);
    animation:twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15;}
    50%{opacity:1;}
  }

  /* ---------- glow blobs ---------- */
  .glow-blob{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    opacity:.35;
    z-index:0;
    pointer-events:none;
  }
  .glow-blob.a{
    width:380px;height:380px;background:var(--c4);
    top:-100px;left:-100px;
    animation:floatA 7s ease-in-out infinite;
  }
  .glow-blob.b{
    width:420px;height:420px;background:var(--c5);
    bottom:-150px;right:-120px;
    animation:floatB 8s ease-in-out infinite;
  }
  .glow-blob.c{
    width:300px;height:300px;background:var(--c12);
    top:40%;left:50%;opacity:.15;
    animation:floatC 6s ease-in-out infinite;
  }
  @keyframes floatA{
    0%,100%{ transform:translate(0,0) scale(1); }
    25%{ transform:translate(60px,40px) scale(1.1); }
    50%{ transform:translate(20px,90px) scale(0.95); }
    75%{ transform:translate(-30px,30px) scale(1.05); }
  }
  @keyframes floatB{
    0%,100%{ transform:translate(0,0) scale(1); }
    30%{ transform:translate(-70px,-40px) scale(1.08); }
    60%{ transform:translate(-20px,-100px) scale(0.92); }
    85%{ transform:translate(40px,-30px) scale(1.04); }
  }
  @keyframes floatC{
    0%,100%{ transform:translate(-50%,-50%) scale(1); }
    33%{ transform:translate(-65%,-35%) scale(1.25); }
    66%{ transform:translate(-35%,-60%) scale(0.85); }
  }

  /* ---------- layout ---------- */
  .stage{
    position:relative;
    z-index:2;
    height:100vh;
    width:100vw;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:3vh 3vw;
  }

  .layout{
    width:100%;
    max-width:640px;
    height:100%;
    max-height:660px;
    display:flex;
  }

  .glass{
    background:linear-gradient(155deg, rgba(247,232,214,0.08), rgba(54,41,32,0.35));
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(247,232,214,0.18);
    border-radius:22px;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.06);
    position:relative;
    overflow:hidden;
  }
  .glass::before{
    content:"";
    position:absolute;
    top:-40%;left:-20%;
    width:140%;height:140%;
    background:radial-gradient(circle at top left, rgba(247,232,214,0.10), transparent 60%);
    pointer-events:none;
  }

  /* ---------- profile card ---------- */
  .profile-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:34px 30px 26px;
    text-align:center;
    gap:12px;
    width:100%;
  }

  .avatar-ring{
    width:150px;
    height:150px;
    border-radius:50%;
    padding:5px;
    background:conic-gradient(from 0deg, var(--c4), var(--c12), var(--c4));
    box-shadow:
      0 0 18px 2px rgba(191,129,88,0.6),
      0 0 34px 6px rgba(199,156,131,0.35);
    animation:ringGlow 3.2s ease-in-out infinite;
    position:relative;
  }
  @keyframes ringGlow{
    0%,100%{
      box-shadow:
        0 0 18px 2px rgba(191,129,88,0.55),
        0 0 30px 6px rgba(199,156,131,0.3);
    }
    50%{
      box-shadow:
        0 0 26px 4px rgba(191,129,88,0.85),
        0 0 46px 10px rgba(199,156,131,0.5);
    }
  }
  .avatar-inner{
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    background:var(--c10);
    border:3px solid var(--c11);
    position:relative;
  }
  .avatar-inner img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* ---------- married heart hover ---------- */
  .avatar-ring{
    cursor:pointer;
  }
  .avatar-heart-ring{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:3px solid #ff2d4d;
    box-shadow:
      0 0 10px 2px rgba(255,45,77,0.7),
      0 0 22px 6px rgba(255,45,77,0.4);
    opacity:0;
    transform:scale(0.9);
    transition:opacity .3s ease, transform .3s ease;
    pointer-events:none;
    z-index:3;
  }
  .avatar-ring:hover .avatar-heart-ring{
    opacity:1;
    transform:scale(1);
    animation:heartPulse 1.1s ease-in-out infinite;
  }
  @keyframes heartPulse{
    0%,100%{
      box-shadow:
        0 0 10px 2px rgba(255,45,77,0.7),
        0 0 22px 6px rgba(255,45,77,0.4);
    }
    50%{
      box-shadow:
        0 0 16px 4px rgba(255,45,77,0.95),
        0 0 34px 10px rgba(255,45,77,0.6);
    }
  }
  .married-badge{
    position:absolute;
    bottom:-6px;
    left:50%;
    transform:translate(-50%,8px);
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 14px;
    border-radius:20px;
    background:rgba(30,10,12,0.9);
    border:1px solid rgba(255,45,77,0.5);
    box-shadow:0 4px 16px rgba(0,0,0,0.5);
    white-space:nowrap;
    font-size:.68rem;
    letter-spacing:.5px;
    color:#ffd7dc;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
    z-index:4;
  }
  .avatar-ring:hover .married-badge{
    opacity:1;
    transform:translate(-50%,0);
  }
  .married-badge svg{
    width:12px;
    height:12px;
    fill:#ff2d4d;
    animation:heartBeat 1s ease-in-out infinite;
  }
  @keyframes heartBeat{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.25); }
  }

  .avatar-shine{
    position:absolute;
    top:0;
    left:-150%;
    width:60%;
    height:100%;
    background:linear-gradient(
      100deg,
      transparent 0%,
      rgba(255,255,255,0.05) 35%,
      rgba(255,255,255,0.55) 50%,
      rgba(255,255,255,0.05) 65%,
      transparent 100%
    );
    transform:skewX(-20deg);
    animation:photoShine 20s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes photoShine{
    0%{ left:-150%; }
    10%{ left:150%; }
    100%{ left:150%; }
  }

  .name-wrap{
    position:relative;
    display:inline-block;
    margin-top:4px;
  }
  .name{
    font-size:2.1rem;
    font-weight:700;
    letter-spacing:1px;
    color:var(--c1);
    text-shadow:0 0 12px rgba(199,156,131,0.4);
    position:relative;
  }

  /* camada de brilho em degradê deslizando por dentro do texto */
  .name-shine{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    font-size:2.1rem;
    font-weight:700;
    letter-spacing:1px;
    font-family:inherit;
    white-space:nowrap;
    pointer-events:none;
    user-select:none;
    background:linear-gradient(
      100deg,
      transparent 0%,
      transparent 42%,
      rgba(255,255,255,0.95) 50%,
      transparent 58%,
      transparent 100%
    );
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    mix-blend-mode:screen;
    animation:nameShine 4s linear infinite;
  }
  @keyframes nameShine{
    0%{ background-position:150% 0; }
    100%{ background-position:-150% 0; }
  }

  .bio{
    font-size:.95rem;
    color:var(--c2);
    line-height:1.6;
    max-width:340px;
    opacity:.9;
  }

  .tag-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:4px;
  }
  .tag{
    font-size:.72rem;
    letter-spacing:.5px;
    padding:5px 12px;
    border-radius:30px;
    border:1px solid rgba(247,232,214,0.25);
    background:rgba(255,255,255,0.04);
    color:var(--c3);
    text-transform:uppercase;
  }

  /* ---------- inner sections (dentro do bloco único) ---------- */
  .divider{
    width:100%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(247,232,214,0.25), transparent);
    margin:6px 0;
  }

  .section{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:center;
  }

  .block-title{
    font-size:.82rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--c12);
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:600;
  }
  .block-title .pixel-icon{
    width:7px;height:7px;
    background:var(--c4);
    box-shadow:0 0 6px 2px rgba(191,129,88,0.7);
  }

  .likes-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    font-size:.85rem;
    color:var(--c2);
    line-height:1.5;
    text-align:center;
  }
  .likes-list span{
    color:var(--c12);
    font-weight:600;
  }

  .links-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    width:100%;
    max-width:320px;
  }
  .link-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    border-radius:14px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(247,232,214,0.15);
    color:var(--c1);
    text-decoration:none;
    font-size:.9rem;
    transition:all .25s ease;
  }
  .link-item:hover{
    background:rgba(191,129,88,0.18);
    border-color:var(--c4);
    transform:translateX(3px);
  }
  .link-item .arrow{color:var(--c4);}
  .link-label{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .link-icon{
    width:18px;
    height:18px;
    border-radius:4px;
    object-fit:cover;
    flex-shrink:0;
  }

  .signature{
    text-align:center;
    font-size:.65rem;
    letter-spacing:1px;
    color:var(--c9);
    opacity:.7;
    margin-top:2px;
  }
  .signature a{
    color:var(--c12);
    text-decoration:none;
    border-bottom:1px solid rgba(199,156,131,0.4);
    transition:color .2s ease, border-color .2s ease;
  }
  .signature a:hover{
    color:var(--c1);
    border-color:var(--c1);
  }

  /* ---------- music player ---------- */
  .player{
    position:absolute;
    bottom:26px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 16px 9px 12px;
    border-radius:40px;
    background:linear-gradient(120deg, rgba(54,41,32,0.75), rgba(106,72,50,0.55));
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(247,232,214,0.2);
    box-shadow:0 6px 24px rgba(0,0,0,0.5);
    width:min(400px, 88vw);
  }

  .play-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    background:var(--c4);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    box-shadow:0 0 14px rgba(191,129,88,0.7);
    transition:transform .2s ease;
  }
  .play-btn:hover{ transform:scale(1.08); }
  .play-btn svg{ width:14px; height:14px; fill:var(--c10); }

  .nav-btn{
    width:26px;
    height:26px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(247,232,214,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform .2s ease, background .2s ease;
  }
  .nav-btn:hover{
    transform:scale(1.1);
    background:rgba(191,129,88,0.25);
  }
  .nav-btn:active{ transform:scale(0.92); }
  .nav-btn svg{ width:12px; height:12px; fill:var(--c2); }

  .track-info{
    flex:1;
    overflow:hidden;
    position:relative;
    height:18px;
  }
  .marquee{
    position:absolute;
    white-space:nowrap;
    font-size:.78rem;
    color:var(--c1);
    letter-spacing:.5px;
    animation:scrollLeft 12s linear infinite;
  }
  @keyframes scrollLeft{
    0%{ transform:translateX(0%); }
    100%{ transform:translateX(-50%); }
  }

  .vol-wrap{
    position:relative;
    flex-shrink:0;
  }
  .vol-btn{
    width:26px;
    height:26px;
    border-radius:50%;
    border:none;
    background:transparent;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .vol-btn svg{ width:16px; height:16px; fill:var(--c2); }

  .vol-popup{
    position:absolute;
    bottom:38px;
    right:-4px;
    background:rgba(54,41,32,0.9);
    border:1px solid rgba(247,232,214,0.2);
    border-radius:14px;
    padding:12px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    opacity:0;
    pointer-events:none;
    transform:translateY(6px);
    transition:all .2s ease;
    box-shadow:0 6px 20px rgba(0,0,0,0.5);
  }
  .vol-popup.show{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
  }
  .vol-slider{
    -webkit-appearance:slider-vertical;
    writing-mode:vertical-lr;
    direction:rtl;
    width:6px;
    height:80px;
    accent-color:var(--c4);
    background:transparent;
    cursor:pointer;
  }
  .vol-val{
    font-size:.65rem;
    color:var(--c3);
  }

  /* ---------- responsive ---------- */
  @media (max-width:820px){
    .profile-card{padding:22px 18px;gap:10px;}
    .avatar-ring{width:100px;height:100px;}
    .name{font-size:1.5rem;}
    .bio{font-size:.85rem;}
  }
</style>
</head>
<body>

<img id="bg-gif" src="https://xatimg.com/image/Cdofct1EeBj7.gif" alt="">
<div id="stars"></div>
<div class="glow-blob a"></div>
<div class="glow-blob b"></div>
<div class="glow-blob c"></div>

<div class="stage">
  <div class="layout">

    <!-- BLOCO ÚNICO -->
    <div class="glass profile-card" id="profileCard" style="opacity:0;transition:opacity .5s ease;">
      <div class="avatar-ring">
        <div class="avatar-inner">
          <img id="avatarImg" src="" alt="foto de perfil">
          <div class="avatar-shine"></div>
        </div>
        <div class="avatar-heart-ring"></div>
        <div class="married-badge">
          <svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.3-8.1C.6 9.9 1.6 6.2 4.8 5.1c2-.7 4 .1 5.2 1.9C11.2 5.2 13.2 4.4 15.2 5.1c3.2 1.1 4.2 4.8 2.1 7.8C18.7 16.65 12 21 12 21z"/></svg>
          Married: INEFFABILIS (1534816445)
        </div>
      </div>
      <div class="name-wrap">
        <div class="name" id="nameText"></div>
        <div class="name-shine" id="nameShine" aria-hidden="true"></div>
      </div>
      <div class="bio" id="bioText"></div>
      <div class="tag-row" id="tagRow"></div>

      <div class="divider"></div>

      <div class="section">
        <div class="block-title"><span class="pixel-icon"></span> Likes</div>
        <div class="likes-list" id="likesList"></div>
      </div>

      <div class="divider"></div>

      <div class="section">
        <div class="block-title"><span class="pixel-icon"></span> Links</div>
        <div class="links-list" id="linksList"></div>
      </div>

      <div class="signature" id="signatureText"></div>
    </div>

  </div>
</div>

<!-- MUSIC PLAYER -->
<div class="player">
  <button class="nav-btn" id="prevBtn" aria-label="Faixa anterior">
    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
  </button>

  <button class="play-btn" id="playBtn">
    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>

  <button class="nav-btn" id="nextBtn" aria-label="Próxima faixa">
    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg>
  </button>

  <div class="track-info">
    <div class="marquee" id="marquee"></div>
  </div>

  <div class="vol-wrap">
    <button class="vol-btn" id="volBtn">
      <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </button>
    <div class="vol-popup" id="volPopup">
      <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="70">
      <div class="vol-val" id="volVal">70%</div>
    </div>
  </div>
</div>

<audio id="audio" muted playsinline preload="auto"></audio>

<script>
  // ==========================================================
  // CONFIGURAÇÃO SUPABASE — preencha com os dados do seu projeto
  // ==========================================================
  const SUPABASE_URL = "https://rndhidaptqczkeowteqz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_fGcCCNqOcXOY6FBcqXKYjg_t7W1qGUO";

  async function loadProfile(){
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/profile?id=eq.1&select=*`, {
        headers:{
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`
        }
      });
      const rows = await res.json();
      const data = rows[0];
      if(data) renderProfile(data);
    } catch(err){
      console.error("Não foi possível carregar o perfil:", err);
    } finally {
      document.getElementById('profileCard').style.opacity = 1;
    }
  }

  function renderProfile(data){
    // cores
    if(data.colors){
      const root = document.documentElement.style;
      Object.entries(data.colors).forEach(([key, val]) => {
        root.setProperty(`--${key}`, val);
      });
    }

    // avatar
    document.getElementById('avatarImg').src = data.avatar_url || '';

    // nome (com camada de shine igual)
    document.getElementById('nameText').textContent = data.name || '';
    document.getElementById('nameShine').textContent = data.name || '';
    document.title = data.name || '';

    // bio (permite <br>)
    document.getElementById('bioText').innerHTML = data.bio || '';

    // tags (removendo "real" e "versão única")
    const tagRow = document.getElementById('tagRow');
    tagRow.innerHTML = '';
    const hiddenTags = ['real', 'versão única', 'versao unica'];
    (data.tags || [])
      .filter(tag => !hiddenTags.includes(String(tag).trim().toLowerCase()))
      .forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = tag;
        tagRow.appendChild(span);
      });

    // likes
    const likesList = document.getElementById('likesList');
    likesList.innerHTML = '';
    (data.likes || []).forEach(like => {
      const div = document.createElement('div');
      div.textContent = like;
      likesList.appendChild(div);
    });

    // links
    const linksList = document.getElementById('linksList');
    linksList.innerHTML = '';
    (data.links || []).forEach(link => {
      const a = document.createElement('a');
      a.className = 'link-item';
      a.href = link.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `
        <span class="link-label">
          ${link.icon ? `<img class="link-icon" src="${link.icon}" alt="">` : ''}
          ${link.label}
        </span>
        <span class="arrow">→</span>
      `;
      linksList.appendChild(a);
    });

    // assinatura
    const sig = document.getElementById('signatureText');
    sig.innerHTML = `Feito por <a href="${data.signature_url}" target="_blank" rel="noopener">${data.signature_name}</a>`;

    // player (volume vem do Supabase, faixas são fixas — ver PLAYLIST)
    const vol = (data.volume ?? 70);
    audio.volume = vol / 100;
    document.getElementById('volSlider').value = vol;
    document.getElementById('volVal').textContent = vol + '%';
  }

  // ---------- pixel stars generator ----------
  const starsContainer = document.getElementById('stars');
  const STAR_COUNT = 90;
  for(let i=0;i<STAR_COUNT;i++){
    const s = document.createElement('div');
    s.className = 'pixel-star';
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    s.style.animationDelay = (Math.random()*3.5) + 's';
    s.style.animationDuration = (2.5 + Math.random()*3) + 's';
    starsContainer.appendChild(s);
  }

  // ---------- player logic ----------
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const volBtn = document.getElementById('volBtn');
  const volPopup = document.getElementById('volPopup');
  const volSlider = document.getElementById('volSlider');
  const volVal = document.getElementById('volVal');
  const marquee = document.getElementById('marquee');

  // ---------- playlist (arquivos mp3 na raiz do repositório) ----------
  const PLAYLIST = [
    { name: "HUGEL - Movin' To The Sun", src: "hugel-movin-to-the-sun.mp3" },
    { name: "Única - Duquesa", src: "unica-duquesa.mp3" },
    { name: "Kehlani - Folded", src: "kehlani-folded.mp3" },
    { name: "Marian Hill - Lips", src: "marian-hill-lips.mp3" }
  ];
  let currentTrack = 0;

  function loadTrack(index){
    currentTrack = (index + PLAYLIST.length) % PLAYLIST.length;
    const track = PLAYLIST[currentTrack];
    audio.src = encodeURI(track.src);
    audio.load();
    marquee.innerHTML = `${track.name} &nbsp;&nbsp;•&nbsp;&nbsp; ${track.name} &nbsp;&nbsp;•&nbsp;&nbsp;`;
  }

  audio.addEventListener('ended', () => {
    loadTrack(currentTrack + 1);
    tryPlay();
  });

  // ajuda a diagnosticar caso o arquivo de áudio não seja encontrado (nome/caminho errado)
  audio.addEventListener('error', () => {
    console.error('Erro ao carregar a faixa de áudio:', audio.src, audio.error);
    // mostra o erro na tela para facilitar o diagnóstico
    const code = audio.error ? audio.error.code : '?';
    const nome = decodeURIComponent(audio.src.split('/').pop());
    marquee.textContent = 'ERRO ' + code + ' ao carregar: ' + nome + ' (4 = arquivo não encontrado ou formato inválido)';
  });

  audio.muted = true; // garante estado mudo desde o início, antes de qualquer tentativa de autoplay
  loadTrack(0);

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

  let userInteracted = false;

  // a interface sempre reflete o estado REAL do elemento <audio>
  function setPlayingUI(on){
    playIcon.innerHTML = on ? ICON_PAUSE : ICON_PLAY;
  }
  audio.addEventListener('play',    () => setPlayingUI(true));
  audio.addEventListener('playing', () => setPlayingUI(true));
  audio.addEventListener('pause',   () => { if(!audio.ended) setPlayingUI(false); });

  function tryPlay(){
    const p = audio.play();
    if(p !== undefined){
      p.catch((err) => {
        console.warn('Não foi possível tocar:', err);
        setPlayingUI(false);
      });
    }
  }

  // libera o som (só vale depois de um gesto do usuário)
  function unlock(){
    userInteracted = true;
    audio.muted = false;
  }

  // chamado dentro de um clique/toque: garante que a faixa atual carregue e toque
  function gesturePlay(){
    unlock();
    if(audio.paused){
      if(audio.error || audio.readyState === 0) audio.load();
      tryPlay();
    }
  }

  // tentativa de autoplay (mudo). Só roda enquanto o usuário ainda não interagiu.
  function startPlaying(){
    if(userInteracted || !audio.paused) return;
    audio.muted = true;
    tryPlay();
  }
  startPlaying();
  audio.addEventListener('canplay', startPlaying);
  window.addEventListener('load', startPlaying);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) startPlaying(); });

  // primeiro clique/toque em qualquer lugar da página
  function firstInteraction(){
    gesturePlay();
    document.removeEventListener('click', firstInteraction);
    document.removeEventListener('touchstart', firstInteraction);
  }
  document.addEventListener('click', firstInteraction);
  document.addEventListener('touchstart', firstInteraction);

  playBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if(audio.paused){
      gesturePlay();          // parado (ou autoplay bloqueado): carrega e toca com som
    } else if(audio.muted){
      unlock();               // tocando mudo pelo autoplay: só liga o som
    } else {
      userInteracted = true;  // tocando com som: pausa
      audio.pause();
    }
  });

  prevBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    unlock();
    loadTrack(currentTrack - 1);
    tryPlay();
  });

  nextBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    unlock();
    loadTrack(currentTrack + 1);
    tryPlay();
  });

  volBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    volPopup.classList.toggle('show');
  });
  document.addEventListener('click', (e) => {
    if(!volPopup.contains(e.target) && e.target !== volBtn){
      volPopup.classList.remove('show');
    }
  });

  volSlider.addEventListener('input', () => {
    const v = volSlider.value;
    unlock();
    audio.volume = v / 100;
    volVal.textContent = v + '%';
  });

  // ---------- carrega os dados do Supabase (nome, bio, links, volume, etc.) ----------
  loadProfile();
</script>

</body>
</html>
